name: Supabase keep-alive

# Supabase pauses a free project after 7 days without activity. This runs one
# trivial query every 2 days so that never happens, and it runs in GitHub's
# cloud, so it works with the laptop switched off.
#
# This one DOES need a secret, because a database URL contains the password:
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  DATABASE_URL
#     Value: the DATABASE_URL line from backend/.env
#
# Until that secret exists the job skips quietly rather than failing, so it
# does not send a failure email every two days.

on:
  schedule:
    - cron: "0 12 */2 * *"   # every 2 days at 12:00 UTC
  workflow_dispatch:          # or run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set, so this keep-alive is skipped."
            echo "Add it under Settings > Secrets and variables > Actions to enable it."
            exit 0
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client
          if psql "$DATABASE_URL" -c "select 1;" >/dev/null 2>&1; then
            echo "Database answered. Project stays active."
          else
            echo "::notice::Database did not answer. It may be paused; open the Supabase dashboard to restore it."
          fi
